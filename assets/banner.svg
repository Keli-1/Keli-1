  <circle cx="246" cy="352" r="120" fill="#8b5cf6" opacity="0.16" filter="url(#softGlow)" />
  <path d="M732 78C882 88 962 150 1114 132C1170 126 1210 108 1280 74V420H692C664 302 638 196 732 78Z" fill="url(#accent)" opacity="0.13" />

