  <text x="638" y="285" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="900">Keli-1</text>
  <text x="638" y="322" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="21">ICT Support | SOC Learner | Full-Stack Builder</text>
