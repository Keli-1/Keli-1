    <path d="M120 0V420" stroke="#38bdf8" />
    <path d="M240 0V420" stroke="#38bdf8" />
    <path d="M360 0V420" stroke="#38bdf8" />
    <path d="M480 0V420" stroke="#38bdf8" />
    <path d="M600 0V420" stroke="#38bdf8" />
    <path d="M720 0V420" stroke="#38bdf8" />
    <path d="M840 0V420" stroke="#38bdf8" />
    <path d="M960 0V420" stroke="#38bdf8" />
    <path d="M1080 0V420" stroke="#38bdf8" />
    <path d="M1200 0V420" stroke="#38bdf8" />
