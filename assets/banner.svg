<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ernest Kekeli Wemegah GitHub profile banner</title>
  <desc id="desc">A dark technology dashboard banner with glowing panels, achievement rows, and tech stack cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816" />
      <stop offset="0.5" stop-color="#0f172a" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.45" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" stop-opacity="0.92" />
      <stop offset="1" stop-color="#020617" stop-opacity="0.82" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.45 0" />
      <feBlend in="SourceGraphic" mode="screen" />
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)" />

  <g opacity="0.18">
    <path d="M0 72H1280" stroke="#38bdf8" />
    <path d="M0 144H1280" stroke="#38bdf8" />
